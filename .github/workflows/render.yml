name: Render Perro

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Blender y dependencias
        run: sudo apt-get update && sudo apt-get install -y blender python3-numpy
      - name: Renderizar el perro
        run: blender -b --factory-startup --python-exit-code 1 --python Perro.py

      - name: Subir la imagen y el modelo 3D
        uses: actions/upload-artifact@v4
        with:
          name: perro-3d
          path: |
            perro.png
            perro.glb
